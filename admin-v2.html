<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vestie — Admin Dashboard v2</title>
<style>
:root {
  --bg-page: #FAF8F5;
  --bg-card: #FFFFFF;
  --bg-sidebar: #F5F0EB;
  --bg-hover: #F0EAE3;
  --bg-active: #EBE3DA;
  --bg-input: #FFFFFF;
  --accent: #C4735B;
  --accent-hover: #B0604A;
  --accent-light: rgba(196, 115, 91, 0.1);
  --accent-glow: rgba(196, 115, 91, 0.18);
  --text-primary: #2D2D2D;
  --text-secondary: #6B7280;
  --text-muted: #9CA3AF;
  --text-on-accent: #FFFFFF;
  --border: #E5DDD3;
  --border-light: #F0EBE3;
  --green: #4CAF50;
  --green-bg: rgba(76, 175, 80, 0.1);
  --red: #E53935;
  --red-bg: rgba(229, 57, 53, 0.1);
  --yellow: #E6A817;
  --yellow-bg: rgba(230, 168, 23, 0.1);
  --blue: #42A5F5;
  --blue-bg: rgba(66, 165, 245, 0.1);
  --purple: #AB47BC;
  --purple-bg: rgba(171, 71, 188, 0.1);
  --shadow: 0 1px 3px rgba(45,45,45,0.06), 0 1px 2px rgba(45,45,45,0.04);
  --shadow-md: 0 4px 12px rgba(45,45,45,0.08);
  --shadow-lg: 0 10px 30px rgba(45,45,45,0.12);
  --radius: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --sidebar-width: 220px;
  --header-height: 60px;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Yu Gothic', sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  background: var(--bg-page);
  color: var(--text-primary);
  font-size: 14px;
  line-height: 1.5;
  display: flex;
  overflow: hidden;
}
.sidebar {
  width: var(--sidebar-width);
  min-width: var(--sidebar-width);
  height: 100vh;
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  z-index: 100;
}
.sidebar-logo {
  padding: 16px 18px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid var(--border);
  min-height: var(--header-height);
}
.sidebar-logo-icon {
  width: 32px; height: 32px;
  background: var(--accent);
  border-radius: var(--radius);
  display: flex; align-items: center; justify-content: center;
  color: var(--text-on-accent); font-weight: 800; font-size: 14px;
}
.sidebar-logo-text {
  font-size: 15px; font-weight: 700; color: var(--text-primary);
}
.sidebar-logo-text span { color: var(--accent); }
.nav-section { padding: 12px 0 4px; }
.nav-section-label {
  padding: 4px 18px 6px;
  font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--text-muted);
}
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 18px;
  margin: 1px 8px;
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 13px; font-weight: 500; color: var(--text-secondary);
  transition: all 0.15s;
}
.nav-item:hover { background: var(--bg-hover); color: var(--text-primary); }
.nav-item.active {
  background: var(--accent-light);
  color: var(--accent);
  font-weight: 600;
}
.nav-item .nav-icon { font-size: 16px; width: 20px; text-align: center; }
.nav-notif {
  margin-left: auto;
  background: var(--red);
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  padding: 1px 6px;
  border-radius: 10px;
  min-width: 18px;
  text-align: center;
}
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.header {
  height: var(--header-height);
  min-height: var(--header-height);
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 16px;
}
.hamburger {
  display: none;
  background: none; border: none;
  font-size: 20px; cursor: pointer;
  padding: 4px; color: var(--text-secondary);
}
.header-search { flex: 1; max-width: 360px; position: relative; }
.header-search input {
  width: 100%;
  padding: 8px 12px 8px 34px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg-input);
  font-size: 13px;
  color: var(--text-primary);
  outline: none;
  transition: border-color 0.2s;
}
.header-search input:focus { border-color: var(--accent); }
.header-search .search-icon {
  position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
  color: var(--text-muted); font-size: 14px;
}
.header-actions {
  display: flex; align-items: center; gap: 8px;
  margin-left: auto;
}
.header-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--bg-card);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  color: var(--text-secondary);
  position: relative;
  transition: all 0.15s;
}
.header-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
.header-btn .dot {
  position: absolute; top: 6px; right: 6px;
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--red);
  border: 2px solid var(--bg-card);
}
.admin-avatar {
  width: 34px; height: 34px;
  border-radius: 50%;
  background: var(--accent);
  color: var(--text-on-accent);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 12px;
  cursor: pointer;
}
.view-container { flex: 1; overflow-y: auto; padding: 24px; }
.alert-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
.alert-pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 12px; font-weight: 600;
  cursor: pointer;
  transition: opacity 0.15s;
}
.alert-pill:hover { opacity: 0.85; }
.alert-pill.red { background: var(--red-bg); color: var(--red); }
.alert-pill.yellow { background: var(--yellow-bg); color: #8B6914; }
.alert-pill.green { background: var(--green-bg); color: var(--green); }
.kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 24px; }
.kpi-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 18px 20px;
  box-shadow: var(--shadow);
}
.kpi-label {
  font-size: 11px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.05em;
  color: var(--text-muted);
  margin-bottom: 4px;
}
.kpi-value { font-size: 26px; font-weight: 800; color: var(--text-primary); line-height: 1.2; }
.kpi-value .kpi-unit { font-size: 14px; font-weight: 600; color: var(--text-muted); }
.kpi-sub { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
.kpi-sub .trend-up { color: var(--green); }
.kpi-sub .trend-down { color: var(--red); }
.widget-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 24px; }
.widget-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 16px 18px;
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: all 0.15s;
}
.widget-card:hover { box-shadow: var(--shadow-md); border-color: var(--accent); }
.widget-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.widget-title { font-size: 13px; font-weight: 600; color: var(--text-primary); }
.widget-icon { font-size: 18px; }
.widget-stats { display: flex; gap: 16px; }
.widget-stat-value { font-size: 20px; font-weight: 800; }
.widget-stat-label { font-size: 11px; color: var(--text-muted); }
.widget-alert { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 10px; display: inline-block; margin-top: 6px; }
.table-wrap {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.table-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
}
.table-title { font-size: 14px; font-weight: 700; }
.table-actions { display: flex; gap: 8px; }
.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.data-table th {
  padding: 10px 14px;
  text-align: left;
  font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.04em;
  color: var(--text-muted);
  background: var(--bg-page);
  border-bottom: 1px solid var(--border);
}
.data-table td { padding: 12px 14px; border-bottom: 1px solid var(--border-light); }
.data-table tbody tr:hover td { background: var(--bg-hover); cursor: pointer; }
.data-table tbody tr:last-child td { border-bottom: none; }
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 11px; font-weight: 600;
}
.badge-green { background: var(--green-bg); color: var(--green); }
.badge-red { background: var(--red-bg); color: var(--red); }
.badge-yellow { background: var(--yellow-bg); color: #8B6914; }
.badge-blue { background: var(--blue-bg); color: #1565C0; }
.badge-purple { background: var(--purple-bg); color: #7B1FA2; }
.badge-gray { background: var(--bg-hover); color: var(--text-muted); }
.badge-accent { background: var(--accent-light); color: var(--accent); }
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 16px;
  border-radius: var(--radius);
  font-size: 13px; font-weight: 600;
  cursor: pointer;
  border: none;
  transition: all 0.15s;
}
.btn-primary { background: var(--accent); color: var(--text-on-accent); }
.btn-primary:hover { background: var(--accent-hover); }
.btn-secondary { background: var(--bg-page); color: var(--text-primary); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--bg-hover); }
.btn-sm { padding: 5px 12px; font-size: 12px; }
.btn-danger { background: var(--red); color: #fff; }
.btn-danger:hover { background: #C62828; }
.filter-bar {
  display: flex; gap: 10px; align-items: center;
  padding: 12px 18px;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}
.filter-bar input, .filter-bar select {
  padding: 7px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 13px;
  background: var(--bg-input);
  outline: none;
  color: var(--text-primary);
}
.filter-bar input:focus, .filter-bar select:focus { border-color: var(--accent); }
.filter-bar input { flex: 1; min-width: 160px; }
.kanban { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; min-height: 400px; }
.kanban-col {
  background: var(--bg-page);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  display: flex;
  flex-direction: column;
}
.kanban-col-header {
  padding: 10px 12px;
  font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.04em;
  color: var(--text-muted);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.kanban-col-count {
  background: var(--bg-sidebar);
  padding: 1px 7px; border-radius: 8px;
  font-size: 11px;
}
.kanban-body { padding: 8px; flex: 1; display: flex; flex-direction: column; gap: 6px; }
.kanban-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 12px;
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: all 0.15s;
}
.kanban-card:hover { box-shadow: var(--shadow-md); border-color: var(--accent); }
.kanban-card.stagnant { border-left: 3px solid var(--red); }
.kanban-card-pair { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
.kanban-card-days { font-size: 11px; color: var(--text-muted); }
.kanban-card-badges { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
.drawer-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(45,45,45,0.3);
  z-index: 200;
  opacity: 0; visibility: hidden;
  transition: all 0.2s;
}
.drawer-overlay.open { opacity: 1; visibility: visible; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0;
  width: 480px; max-width: 100vw;
  background: var(--bg-card);
  border-left: 1px solid var(--border);
  box-shadow: var(--shadow-lg);
  z-index: 201;
  transform: translateX(100%);
  transition: transform 0.25s ease;
  display: flex; flex-direction: column;
  overflow: hidden;
}
.drawer.open { transform: translateX(0); }
.drawer-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
}
.drawer-title { font-size: 16px; font-weight: 700; }
.drawer-close {
  width: 32px; height: 32px;
  border: none; background: none;
  font-size: 20px; cursor: pointer;
  color: var(--text-muted);
  border-radius: var(--radius);
  display: flex; align-items: center; justify-content: center;
}
.drawer-close:hover { background: var(--bg-hover); color: var(--text-primary); }
.drawer-body { flex: 1; overflow-y: auto; padding: 20px; }
.drawer-section { margin-bottom: 20px; }
.drawer-section-label {
  font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--text-muted);
  margin-bottom: 6px;
}
.drawer-field { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13px; }
.drawer-field-label { color: var(--text-secondary); }
.drawer-field-value { font-weight: 600; }
.modal-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(45,45,45,0.35);
  z-index: 300;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; visibility: hidden;
  transition: all 0.2s;
}
.modal-overlay.open { opacity: 1; visibility: visible; }
.modal {
  background: var(--bg-card);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  width: 540px; max-width: 92vw;
  max-height: 80vh;
  display: flex; flex-direction: column;
  overflow: hidden;
}
.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
}
.modal-title { font-size: 16px; font-weight: 700; }
.modal-close {
  width: 32px; height: 32px;
  border: none; background: none;
  font-size: 20px; cursor: pointer;
  color: var(--text-muted);
  border-radius: var(--radius);
  display: flex; align-items: center; justify-content: center;
}
.modal-close:hover { background: var(--bg-hover); color: var(--text-primary); }
.modal-body { padding: 20px; overflow-y: auto; flex: 1; }
.modal-footer {
  display: flex; gap: 8px; justify-content: flex-end;
  padding: 14px 20px;
  border-top: 1px solid var(--border);
}
.chat-view { display: flex; flex-direction: column; height: 100%; }
.chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.chat-bubble {
  max-width: 80%;
  padding: 10px 14px;
  border-radius: var(--radius-md);
  font-size: 13px;
  line-height: 1.4;
}
.chat-bubble.left { align-self: flex-start; background: var(--bg-page); border: 1px solid var(--border); }
.chat-bubble.right { align-self: flex-end; background: var(--accent-light); border: 1px solid rgba(196,115,91,0.2); }
.chat-bubble .chat-meta { font-size: 10px; color: var(--text-muted); margin-top: 4px; }
.chat-bubble.flagged { border-color: var(--red); background: var(--red-bg); }
.toast {
  position: fixed; bottom: 24px; right: 24px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 14px 20px;
  display: flex; align-items: center; gap: 12px;
  box-shadow: var(--shadow-lg);
  z-index: 400;
  opacity: 0; transform: translateY(16px);
  transition: all 0.25s;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateY(0); }
@media (max-width: 1200px) {
  .kpi-row { grid-template-columns: repeat(2, 1fr); }
  .widget-grid { grid-template-columns: repeat(2, 1fr); }
  .kanban { grid-template-columns: repeat(3, 1fr); }
}
@media (max-width: 900px) {
  .sidebar { position: fixed; left: 0; top: 0; transform: translateX(-100%); transition: transform 0.25s; z-index: 101; }
  .sidebar.open { transform: translateX(0); }
  .hamburger { display: block; }
  .kanban { grid-template-columns: repeat(2, 1fr); }
  .drawer { width: 100vw; }
}
@media (max-width: 640px) {
  .kpi-row { grid-template-columns: 1fr; }
  .widget-grid { grid-template-columns: 1fr; }
  .kanban { grid-template-columns: 1fr; }
  .view-container { padding: 16px; }
  .header { padding: 0 16px; }
  .header-search { display: none; }
}
</style>
</head>

<script>

// ═══════════════════════════════════════════════════════════════
//  MOCK DATA
// ═══════════════════════════════════════════════════════════════

const DB = {

let currentTab = 'overview';

function $(id) { return document.getElementById(id); }

function badge(status, labels) {
  const map = labels || { verified:'green', active:'green', pending:'yellow', suspended:'red', open:'red', reviewed:'blue', closed:'gray', live:'green', rejected:'red', not_started:'gray', draft:'yellow', sent:'blue', complete:'green', delivered:'green', failed:'red', expiring:'yellow', premium:'purple' };
  const cls = map[status] || 'gray';
  const label = status.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase());
  return '<span class="badge badge-' + cls + '">' + label + '</span>';
}

function avatar(name, size) {
  const initials = name.split(' ').map(w => w[0]).join('').substring(0,2).toUpperCase();
  const s = size || 32;
  return '<div style="width:' + s + 'px;height:' + s + 'px;border-radius:50%;background:var(--accent);color:var(--text-on-accent);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:' + Math.round(s*0.4) + 'px;flex-shrink:0;">' + initials + '</div>';
}

function showToast(msg, icon) {
  const t = $('toast');
  $('toastText').textContent = msg;
  $('toastIcon').textContent = icon || '\u2705';
  t.classList.add('show');
  clearTimeout(t._hide);
  t._hide = setTimeout(function() { t.classList.remove('show'); }, 2500);
}

function logAudit(action, detail, module) {
  DB.audit.unshift({
    id:'aud' + Date.now(),
    ts: new Date().toISOString().slice(0,16).replace('T',' '),
    admin:'Anna', action: action, detail: detail, module: module
  });
}

function openDrawer(title, html) {
  $('drawerTitle').textContent = title;
  $('drawerBody').innerHTML = html;
  $('drawerOverlay').classList.add('open');
  $('drawer').classList.add('open');
}

function closeDrawer() {
  $('drawerOverlay').classList.remove('open');
  $('drawer').classList.remove('open');
}

function openModal(title, bodyHtml, footerHtml) {
  $('modalTitle').textContent = title;
  $('modalBody').innerHTML = bodyHtml;
  $('modalFooter').innerHTML = footerHtml || '';
  $('modalOverlay').classList.add('open');
}

function closeModal() {
  $('modalOverlay').classList.remove('open');
}

function userRow(u) {
  return '<tr onclick="showUserDrawer(\'' + u.id + '\')"'

// ═══════════════════════════════════════════════════════════════
//  ROUTER
// ═══════════════════════════════════════════════════════════════
function switchTab(tab) {
  if (!Tabs[tab]) return;
  currentTab = tab;
  document.querySelectorAll('.nav-item').forEach(function(el) {
    el.classList.toggle('active', el.dataset.tab === tab);
  });
  $('viewContainer').innerHTML = Tabs[tab]();
  if (tab === 'documents') filterDocuments();
  if (tab === 'users' && $('userSearch')) filterUsers();
}

// ═══════════════════════════════════════════════════════════════
//  USER FILTER
// ═══════════════════════════════════════════════════════════════
function filterUsers() {
  var q = ($('userSearch') ? $('userSearch').value : '').toLowerCase();
  var role = ($('userRoleFilter') ? $('userRoleFilter').value : '');
  var status = ($('userStatusFilter') ? $('userStatusFilter').value : '');
  var filtered = DB.users.filter(function(u) {
    if (q && !u.name.toLowerCase().includes(q) && !u.email.toLowerCase().includes(q)) return false;
    if (role && u.role !== role) return false;
    if (status && u.status !== status) return false;
    return true;
  });
  var tbody = $('userTableBody');
  if (tbody) tbody.innerHTML = filtered.map(userRow).join('');
}

function filterDocuments() {
  var type = ($('docTypeFilter') ? $('docTypeFilter').value : '');
  var status = ($('docStatusFilter') ? $('docStatusFilter').value : '');
  var filtered = DB.documents.filter(function(d) {
    if (type && d.type !== type) return false;
    if (status === 'verified' && !d.verified) return false;
    if (status === 'pending' && d.verified) return false;
    return true;
  });
  var tbody = $('docTableBody');
  if (tbody) tbody.innerHTML = filtered.map(docRow).join('');
}

//  USER DRAWER
// ═══════════════════════════════════════════════════════════════
function showUserDrawer(userId) {
  var u = userMap[userId];
  if (!u) return;
  var deal = DB.deals.find(function(d) { return d.id === u.dealId; });
  var convos = DB.conversations.filter(function(c) { return c.participants.indexOf(userId) >= 0; });
  var docs = DB.documents.filter(function(d) { return d.uploadedBy === userId; });
  var flags = DB.flags.filter(function(f) { return f.targetId === userId || f.reporterId === userId; });

  var html = '<div style="display:flex;align-items:center;gap:14px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border);">'
    + avatar(u.name, 48)
    + '<div><div style="font-size:18px;font-weight:700;">' + u.name + '</div><div style="color:var(--text-secondary);font-size:13px;">' + u.email + '</div><div style="margin-top:4px;">' + badge(u.status) + ' <span class="badge badge-gray">' + u.roleLabel + '</span></div></div></div>'
    + '<div class="drawer-section"><div class="drawer-section-label">Profile Details</div>'
    + '<div class="drawer-field"><span class="drawer-field-label">Phone</span><span class="drawer-field-value">' + u.phone + '</span></div>'
    + '<div class="drawer-field"><span class="drawer-field-label">Budget</span><span class="drawer-field-value">' + u.budget + '</span></div>'
    + '<div class="drawer-field"><span class="drawer-field-label">Location</span><span class="drawer-field-value">' + u.location + '</span></div>'
    + '<div class="drawer-field"><span class="drawer-field-label">Goal</span><span class="drawer-field-value">' + u.goal + '</span></div>'
    + '<div class="drawer-field"><span class="drawer-field-label">Timeline</span><span class="drawer-field-value">' + u.timeline + '</span></div>'
    + '<div class="drawer-field"><span class="drawer-field-label">Joined</span><span class="drawer-field-value">' + u.created + '</span></div></div>';

  if (deal) {
    html += '<div class="drawer-section"><div class="drawer-section-label">Deal</div>'
      + '<div class="drawer-field"><span class="drawer-field-label">Deal ID</span><span class="drawer-field-value">' + deal.id.toUpperCase() + '</span></div>'
      + '<div class="drawer-field"><span class="drawer-field-label">Stage</span><span class="drawer-field-value">' + DB.stageLabels[deal.stage] + '</span></div>'
      + '<div class="drawer-field"><span class="drawer-field-label">Partner</span><span class="drawer-field-value">' + deal.pair.filter(function(id) { return id !== userId; }).map(function(id) { return (userMap[id] || { name:id }).name; }).join(', ') + '</span></div></div>';
  } else {
    html += '<div class="drawer-section"><div class="drawer-section-label">Deal</div><div style="color:var(--text-muted);font-size:13px;">No active deal</div></div>';
  }

  if (convos.length) {
    html += '<div class="drawer-section"><div class="drawer-section-label">Conversations (' + convos.length + ')</div>';
    convos.forEach(function(c) {
      var partner = c.participants.find(function(pid) { return pid !== userId; });
      html += '<div style="padding:8px 0;border-bottom:1px solid var(--border-light);font-size:13px;"><span style="font-weight:600;">With ' + ((userMap[partner] || {}).name || partner) + '</span>' + (c.flagged ? '<span class="badge badge-red" style="margin-left:6px;">Flagged</span>' : '') + '</div>';
    });
    html += '</div>';
  }

  if (docs.length) {
    html += '<div class="drawer-section"><div class="drawer-section-label">Documents (' + docs.length + ')</div>';
    docs.forEach(function(d) {
      html += '<div style="display:flex;justify-content:space-between;padding:6px 0;font-size:12px;border-bottom:1px solid var(--border-light);"><span>' + d.name + '</span>' + (d.verified ? badge('verified') : badge('pending')) + '</div>';
    });
    html += '</div>';
  }

  var suspendBtn = u.status !== 'suspended'
    ? '<button class="btn btn-sm btn-danger" onclick="suspendUser(\'' + userId + '\')">Suspend User</button>'
    : '<button class="btn btn-sm btn-primary" onclick="unsuspendUser(\'' + userId + '\')">Reinstate User</button>';

  html += '<div style="display:flex;gap:8px;margin-top:16px;padding-top:16px;border-top:1px solid var(--border);">'
    + suspendBtn
    + '<button class="btn btn-sm btn-secondary" onclick="showToast(\'Email sent\',\'\uD83D\uDCE7\')">Send Email</button>'
    + (deal ? '<button class="btn btn-sm btn-secondary" onclick="showTopicDealModal(\'' + deal.id + '\')">View Deal</button>' : '')
    + '</div>';

  openDrawer(u.name, html);
}

function suspendUser(id) {
  var u = userMap[id];
  if (u) { u.status = 'suspended'; showToast(u.name + ' suspended', '\u26D4'); logAudit('User suspended', id + ' \u2014 ' + u.name, 'users'); }
  closeDrawer();
  if (currentTab === 'users') switchTab('users');
}

function unsuspendUser(id) {
  var u = userMap[id];
  if (u) { u.status = 'active'; showToast(u.name + ' reinstated', '\u2705'); logAudit('User reinstated', id + ' \u2014 ' + u.name, 'users'); }
  closeDrawer();
  if (currentTab === 'users') switchTab('users');
}

    + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;">'
    + '<div class="kpi-card" style="cursor:pointer;" onclick="showUserDrawer(\'' + u1.id + '\')"><div class="kpi-label">Co-Buyer A</div><div style="display:flex;align-items:center;gap:8px;margin-top:4px;">' + avatar(u1.name) + ' <span style="font-weight:600;">' + u1.name + '</span></div><div style="font-size:12px;color:var(--text-secondary);">' + u1.budget + ' \u00B7 ' + u1.location + '</div></div>'
    + '<div class="kpi-card" style="cursor:pointer;" onclick="showUserDrawer(\'' + u2.id + '\')"><div class="kpi-label">Co-Buyer B</div><div style="display:flex;align-items:center;gap:8px;margin-top:4px;">' + avatar(u2.name) + ' <span style="font-weight:600;">' + u2.name + '</span></div><div style="font-size:12px;color:var(--text-secondary);">' + u2.budget + ' \u00B7 ' + u2.location + '</div></div></div>'
    + '<div class="drawer-section"><div class="drawer-section-label">Current Stage</div>'
    + '<div style="display:flex;align-items:center;gap:8px;padding:10px;background:var(--accent-light);border-radius:var(--radius);"><span style="font-size:24px;">' + ['\uD83E\uDD1D','\uD83D\uDCB0','\uD83D\uDCDD','\uD83D\uDD0D','\uD83D\uDCD1','\u2705'][d.stage] + '</span>'
    + '<div><div style="font-weight:700;">' + DB.stageLabels[d.stage] + '</div><div style="font-size:12px;color:var(--text-secondary);">' + d.daysInStage + ' days in stage' + (d.stagnant ? ' \u2014 <span style="color:var(--red);font-weight:600;">STAGNANT</span>' : '') + '</div></div></div></div>'
    + '<div class="drawer-section"><div class="drawer-section-label">Partners Assigned</div><div style="display:flex;flex-wrap:wrap;gap:6px;">' + d.partners.map(function(p) { return '<span class="badge badge-gray" style="font-size:12px;padding:4px 10px;">' + p + '</span>'; }).join('') + '</div></div>';

  if (conv) {
    body += '<div class="drawer-section"><div class="drawer-section-label">Recent Messages</div>'
      + conv.messages.slice(-3).map(function(m) {
        return '<div style="padding:6px 0;font-size:12px;border-bottom:1px solid var(--border-light);"><span style="font-weight:600;">' + ((userMap[m.from] || {}).name || m.from) + ':</span> ' + m.text + (m.flagged ? '<span class="badge badge-red" style="margin-left:4px;">Flagged</span>' : '') + '</div>';
      }).join('') + '</div>';
  }

  if (docs.length) {
    body += '<div class="drawer-section"><div class="drawer-section-label">Documents (' + docs.length + ')</div>'
      + docs.map(function(doc) {
        return '<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:12px;border-bottom:1px solid var(--border-light);"><span>' + doc.name + '</span>' + (doc.verified ? badge('verified') : badge('pending')) + '</div>';
      }).join('') + '</div>';
  }

  var footerBtns = '<button class="btn btn-secondary" onclick="showToast(\'Reminder sent\',\'\uD83D\uDCE7\')">Send Reminder</button>';
  if (d.stage < 5) {
    footerBtns += '<button class="btn btn-primary" onclick="advanceDeal(\'' + dealId + '\')">Advance to ' + DB.stageLabels[d.stage + 1] + '</button>';
  }
  footerBtns += '<button class="btn btn-secondary" onclick="closeModal()">Close</button>';

  openModal('Deal ' + dealId.toUpperCase(), body, footerBtns);
}

function showTopicDealModal(dealId) {
  closeDrawer();
  setTimeout(function() { showDealModal(dealId); }, 300);
}

function advanceDeal(dealId) {
  var d = DB.deals.find(function(x) { return x.id === dealId; });
  if (!d || d.stage >= 5) return;
  var oldStage = d.stage;
  d.stage++;
  d.daysInStage = 0;
  d.stagnant = false;
  showToast('Advanced to ' + DB.stageLabels[d.stage], '\uD83C\uDF89');
  logAudit('Deal advanced', dealId.toUpperCase() + ' \u2014 ' + DB.stageLabels[oldStage] + ' \u2192 ' + DB.stageLabels[d.stage], 'deals');
  closeModal();
  switchTab('deals');
}

// ═══════════════════════════════════════════════════════════════
//  LISTING MODAL
// ═══════════════════════════════════════════════════════════════
function showListingModal(listingId) {
  var l = DB.listings.find(function(x) { return x.id === listingId; });
  if (!l) return;
  var body = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;"><div style="font-size:18px;font-weight:700;">' + l.address + '</div>' + badge(l.status, { pending:'yellow', live:'green', rejected:'red' }) + '</div>'
    + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;">'
    + '<div class="drawer-field"><span class="drawer-field-label">Type</span><span class="drawer-field-value">' + l.type + '</span></div>'
    + '<div class="drawer-field"><span class="drawer-field-label">Price</span><span class="drawer-field-value">$' + l.price.toLocaleString() + '</span></div>'
    + '<div class="drawer-field"><span class="drawer-field-label">Bedrooms</span><span class="drawer-field-value">' + l.bedrooms + '</span></div>'
    + '<div class="drawer-field"><span class="drawer-field-label">Bathrooms</span><span class="drawer-field-value">' + l.bathrooms + '</span></div>'
    + '<div class="drawer-field"><span class="drawer-field-label">Broker</span><span class="drawer-field-value">' + l.brokerName + '</span></div>'
    + '<div class="drawer-field"><span class="drawer-field-label">Agency</span><span class="drawer-field-value">' + l.company + '</span></div>'
    + '<div class="drawer-field"><span class="drawer-field-label">Photos</span><span class="drawer-field-value">' + l.photos + ' images</span></div>'
    + '<div class="drawer-field"><span class="drawer-field-label">Submitted</span><span class="drawer-field-value">' + l.submittedAt + '</span></div></div>'
    + (l.reason ? '<div style="padding:12px;background:var(--red-bg);border-radius:var(--radius);margin-bottom:12px;"><div style="font-weight:600;color:var(--red);margin-bottom:4px;">Rejection Reason</div><div style="font-size:13px;">' + l.reason + '</div></div>' : '')
    + '<div style="padding:12px;background:var(--bg-page);border-radius:var(--radius);"><div style="font-weight:600;margin-bottom:8px;">\uD83D\uDCF8 Property Photos</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;">'
    + Array.from({ length: Math.min(l.photos, 6) }, function() { return '<div style="aspect-ratio:4/3;background:var(--border);border-radius:var(--radius);display:flex;align-items:center;justify-content:center;font-size:24px;">\uD83C\uDFE0</div>'; }).join('') + '</div></div>';

  var footer = l.status === 'pending'
    ? '<button class="btn btn-primary" onclick="approveListing(\'' + listingId + '\')">\u2713 Approve</button><button class="btn btn-danger" onclick="rejectListing(\'' + listingId + '\')">\u2715 Reject</button><button class="btn btn-secondary" onclick="closeModal()">Close</button>'
    : '<button class="btn btn-secondary" onclick="closeModal()">Close</button>';

  openModal('Listing: ' + l.brokerName, body, footer);
}

function approveListing(id) {
  var l = DB.listings.find(function(x) { return x.id === id; });
  if (l) { l.status = 'live'; showToast(l.address.split(',')[0] + ' approved', '\u2705'); logAudit('Listing approved', id + ' \u2014 ' + l.address + ' (' + l.company + ')', 'listings'); }
  closeModal();
  switchTab('listings');
}

function rejectListing(id) {
  var l = DB.listings.find(function(x) { return x.id === id; });
  var reason = prompt('Rejection reason:');
  if (!reason) return;
  if (l) { l.status = 'rejected'; l.reason = reason; showToast(l.address.split(',')[0] + ' rejected', '\u26D4'); logAudit('Listing rejected', id + ' \u2014 ' + l.address + ' \u2014 reason: ' + reason, 'listings'); }
  closeModal();
  switchTab('listings');
}

// ═══════════════════════════════════════════════════════════════
//  CONVERSATION VIEW
// ═══════════════════════════════════════════════════════════════
function showConversation(convId) {
  var c = DB.conversations.find(function(x) { return x.id === convId; });
  if (!c) return;
  var participants = c.participants.map(function(pid) { return (userMap[pid] || { name:pid }).name; }).join(' & ');

  var body = '<div class="chat-view">'
    + '<div style="display:flex;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid var(--border);margin-bottom:12px;">'
    + '<div style="font-weight:700;flex:1;">' + participants + '</div>'
    + (c.flagged ? '<span class="badge badge-red">Flagged</span>' : '')
    + '<button class="btn btn-sm ' + (c.flagged ? 'btn-primary' : 'btn-secondary') + '" onclick="resolveFlag_conv(\'' + convId + '\')">' + (c.flagged ? '\u2713 Clear Flag' : 'Mark Reviewed') + '</button></div>'
    + '<div class="chat-messages" style="max-height:400px;overflow-y:auto;">'
    + c.messages.map(function(m) {
      var isRight = m.from === c.participants[0];
      return '<div class="chat-bubble ' + (isRight ? 'right' : 'left') + (m.flagged ? ' flagged' : '') + '"><div style="font-weight:600;font-size:12px;margin-bottom:2px;">' + ((userMap[m.from] || {}).name || m.from) + '</div><div>' + m.text + '</div><div class="chat-meta">' + m.ts + (m.flagged ? ' \u00B7 \uD83D\uDEA9 Reported' : '') + '</div></div>';
    }).join('') + '</div>'
    + '<div style="padding:12px 0;border-top:1px solid var(--border);display:flex;gap:8px;">'
    + '<input type="text" placeholder="Reply as Anna..." style="flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px;" onkeydown="if(event.key===\'Enter\'){showToast(\'Reply sent\',\'\uD83D\uDCE7\');this.value=\'\'}">'
    + '<button class="btn btn-primary btn-sm" onclick="var i=this.previousElementSibling;showToast(\'Reply sent\',\'\uD83D\uDCE7\');i.value=\'\'">Send</button></div></div>';

  openDrawer('\uD83D\uDCAC ' + participants, body);
}

function resolveFlag_conv(convId) {
  var c = DB.conversations.find(function(x) { return x.id === convId; });
  if (c) { c.adminReviewed = true; c.flagged = false; showToast('Flag resolved', '\u2705'); logAudit('Flag reviewed', 'Conversation ' + convId + ' \u2014 cleared', 'messages'); }
  closeDrawer();
  switchTab('messages');
}

// ═══════════════════════════════════════════════════════════════
//  TRUST FLAG RESOLVE
// ═══════════════════════════════════════════════════════════════
function resolveFlag(flagId) {
  var f = DB.flags.find(function(x) { return x.id === flagId; });
  if (f) { f.status = 'reviewed'; showToast('Flag resolved', '\u2705'); logAudit('Flag reviewed', flagId + ' \u2014 ' + f.reason, 'trust'); }
  switchTab('trust');
}

// ═══════════════════════════════════════════════════════════════
//  BILLING ACTIONS
// ═══════════════════════════════════════════════════════════════
function settleSplit(idx) {
  var b = DB.billing;
  var s = b.splitInvoices[idx];
  if (!s) return;
  var changed = false;
  if (!s.paidA) { s.paidA = true; changed = true; }
  if (!s.paidB) { s.paidB = true; changed = true; }
  if (!changed) return;
  b.pendingSplits = b.splitInvoices.filter(function(x) { return !x.paidA || !x.paidB; }).length;
  updateBillingUI();
  showToast(s.pair.split(' ')[0] + ' split settled', '\uD83D\uDCB0');
  logAudit('Split settled', s.pair + ' \u2014 ' + s.service + ' \u2014 $' + s.total, 'billing');
}

function settleReferral(idx) {
  var b = DB.billing;
  var r = b.referrals[idx];
  if (!r || r.paid) return;
  r.paid = true;
  b.earned += r.value;
  b.outstanding -= r.value;
  b.reverse += r.reverse;
  updateBillingUI();
  showToast(r.ref + ' marked paid', '\uD83D\uDCB0');
  logAudit('Commission marked paid', r.ref + ' \u2014 ' + r.partner + ' \u2014 $' + r.value, 'billing');
}

function updateBillingUI() {
  var b = DB.billing;
  var set = function(id, val) { var el = $(id); if (el) el.innerHTML = val; };
  set('bDownloads', b.downloads.toLocaleString());
  set('bActive', b.active);
  set('bEarned', '$' + b.earned.toLocaleString());
  set('bMRR', '$' + b.mrr);
  set('bOutstanding', '$' + b.outstanding.toLocaleString());
  set('bFreeUsers', b.freeUsers.toLocaleString() + ' / ' + b.premiumUsers);
  set('bPendingSplits', b.pendingSplits);
  b.splitInvoices.forEach(function(s, i) {
    var aEl = $('splitA' + i), bEl = $('splitB' + i);
    if (aEl) aEl.innerHTML = s.paidA ? '<span class="badge badge-green">Paid</span>' : '<span class="badge badge-yellow">Pending</span>';
    if (bEl) bEl.innerHTML = s.paidB ? '<span class="badge badge-green">Paid</span>' : '<span class="badge badge-yellow">Pending</span>';
  });
  b.referrals.forEach(function(r, i) {
    var el = $('feeStatus' + i);
    if (el) el.innerHTML = r.paid ? '<span class="badge badge-green">Paid</span>' : '<span class="badge badge-yellow">Pending</span>';
  });
}

function bumpDownloads() {
  DB.billing.downloads++;
  updateBillingUI();
  showToast('+1 download', '\uD83D\uDCF1');
  logAudit('Download simulated', 'App install +1', 'billing');
}

function bumpActive() {
  var bump = Math.floor(Math.random() * 25) + 5;
  DB.billing.active += bump;
  updateBillingUI();
  showToast('+' + bump + ' active users', '\uD83D\uDCE1');
  logAudit('Traffic simulated', '+' + bump + ' concurrent users', 'billing');
}

function exportCSV() {
  var b = DB.billing;
  var ts = new Date().toISOString().slice(0,10);
  var filename = 'vestie_ledger_' + ts + '.csv';
  var rows1 = b.splitInvoices.map(function(s) { return [s.pair, s.service, '$' + s.total, s.paidA ? 'Paid' : 'Pending', s.paidB ? 'Paid' : 'Pending'].join(','); });
  var rows2 = b.referrals.map(function(r) { return [r.ref, r.pair, r.partner, r.paid ? 'Paid' : 'Pending'].join(','); });
  var csv = 'Stream 1 - User Splits\nPair,Service,Total,User A,User B\n' + rows1.join('\n') + '\n\nStream 2 - Commissions\nInvoice,Pair,Partner,Status\n' + rows2.join('\n');
  var blob = new Blob([csv], { type:'text/csv' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  a.click(); URL.revokeObjectURL(url);
  showToast('CSV exported: ' + filename, '\uD83D\uDCE5');
  logAudit('CSV exported', filename, 'billing');
}

// ═══════════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', function() {
  // Sidebar nav click
  document.querySelectorAll('.nav-item').forEach(function(el) {
    el.addEventListener('click', function(e) {
      var tab = this.dataset.tab;
      if (tab) {
        switchTab(tab);
        // Close mobile sidebar
        $('sidebar').classList.remove('open');
      }
    });
  });

  // Hamburger
  $('hamburger').addEventListener('click', function() {
    $('sidebar').classList.toggle('open');
  });

  // Drawer close
  $('drawerClose').addEventListener('click', closeDrawer);
  $('drawerOverlay').addEventListener('click', closeDrawer);

  // Modal close
  $('modalClose').addEventListener('click', closeModal);
  $('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  // Keyboard: Escape closes drawer/modal
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      closeModal();
      closeDrawer();
    }
  });

  // Global search
  $('globalSearch').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && this.value.trim()) {
      showToast('Searching for "' + this.value.trim() + '"', '\uD83D\uDD0D');
    }
  });

  // Render default tab
  switchTab('overview');
});
</script>
</body>
</html>
